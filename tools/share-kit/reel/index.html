<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Vestora tokens — mirror src/index.css */
      :root {
        --ground: #eef2f6;
        --ink: #14213d;
        --paper: #ffffff;
        --level: #02a26d;
        --level-line: #029a67;
        --tilt: #e8a33d;
        --risk: #d8454b;
        --equity: #4c5ce6;
        --debt: #1f8a9e;
        --gold: #c99a2e;
        --cash: #6b7a90;
        /* One family (owner ruling 2026-11-27): all three tokens resolve to Figtree. */
        --font-display: 'Figtree', sans-serif;
        --font-body: 'Figtree', sans-serif;
        --font-mono: 'Figtree', sans-serif;
      }
      @font-face {
        font-family: 'Figtree';
        font-style: normal;
        font-weight: 400 800;
        src: url('assets/fonts/figtree-var.woff2') format('woff2');
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--ground);
        font-family: var(--font-body);
        color: var(--ink);
      }
      #root { width: 100%; height: 100%; position: relative; }
      .scene-host { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1080"
      data-height="1920"
    >
      <div data-composition-id="street" data-composition-src="compositions/street.html" data-start="0" data-duration="14" data-track-index="1" data-track-kind="graphics"></div>
      <div data-composition-id="beam" data-composition-src="compositions/beam.html" data-start="14" data-duration="8" data-track-index="2" data-track-kind="graphics"></div>
      <div data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="22" data-duration="6" data-track-index="3" data-track-kind="graphics"></div>
      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="28" data-track-index="0" data-track-kind="music"></audio>
    </div>
    <script>
      // Root timeline: scene fades are handled inside each composition's own timeline.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
