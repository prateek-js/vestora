<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { width: 1200px; height: 627px; overflow: hidden; }
  .card {
    width: 1200px; height: 627px; position: relative;
    background: var(--mist); color: var(--ink);
    box-sizing: border-box; padding: 56px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .logo-row { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--level); color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Figtree', sans-serif; font-weight: 800; font-size: 20px;
  }
  .logo-word { font-family: 'Figtree', sans-serif; font-weight: 700; letter-spacing: 0.16em; font-size: 17px; }
  .middle { display: flex; align-items: center; gap: 48px; }
  .copy { max-width: 560px; }
  h1 { font-family: 'Figtree', sans-serif; font-weight: 800; font-size: 56px; line-height: 1.08; margin: 0 0 18px; letter-spacing: -0.01em; }
  h1 .honest { color: var(--level); }
  .sub { font-size: 23px; line-height: 1.45; color: var(--ink); opacity: 0.72; margin: 0; }
  .footer { display: flex; justify-content: space-between; align-items: baseline; }
  .url { font-family: 'Figtree', sans-serif; font-weight: 600; font-size: 20px;   font-variant-numeric: tabular-nums;
  }
  .privacy { font-size: 17px; color: var(--ink); opacity: 0.62; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-mark">V</div>
    <div class="logo-word">VESTORA</div>
  </div>
  <div class="middle">
    <div class="copy">
      <h1>Your money,<br>honestly <span class="honest">weighed</span>.</h1>
      <p class="sub">FDs, funds, stocks, gold and a home loan — seen together, on your device.</p>
    </div>
    <!-- The balance beam, level. Same geometry as the demo's Beam: pivot, arm, two pans. -->
    <svg width="380" height="300" viewBox="0 0 380 300" fill="none" aria-hidden="true">
      <!-- stand -->
      <line x1="190" y1="60" x2="190" y2="252" stroke="#14213D" stroke-width="3"/>
      <line x1="120" y1="256" x2="260" y2="256" stroke="#14213D" stroke-width="3" stroke-linecap="round"/>
      <!-- beam arm, level -->
      <line x1="50" y1="60" x2="330" y2="60" stroke="#029A67" stroke-width="5" stroke-linecap="round"/>
      <!-- pivot -->
      <circle cx="190" cy="60" r="7" fill="#14213D"/>
      <!-- left pan: growth assets -->
      <line x1="50" y1="60" x2="50" y2="118" stroke="#14213D" stroke-width="2"/>
      <rect x="20" y="118" width="60" height="10" rx="5" fill="#14213D"/>
      <rect x="28" y="88" width="18" height="30" rx="3" fill="#4C5CE6"/>
      <rect x="50" y="98" width="16" height="20" rx="3" fill="#1F8A9E"/>
      <!-- right pan: steadier assets -->
      <line x1="330" y1="60" x2="330" y2="118" stroke="#14213D" stroke-width="2"/>
      <rect x="300" y="118" width="60" height="10" rx="5" fill="#14213D"/>
      <rect x="308" y="94" width="16" height="24" rx="3" fill="#1F8A9E"/>
      <rect x="328" y="102" width="14" height="16" rx="3" fill="#C99A2E"/>
      <rect x="346" y="106" width="12" height="12" rx="3" fill="#6B7A90"/>
      <!-- the level mark -->
      <text x="190" y="36" text-anchor="middle" font-family="Figtree, sans-serif" font-size="13" fill="#029A67" font-weight="700">LEVEL</text>
    </svg>
  </div>
  <div class="footer">
    <div class="url">vestora-wealth.ai.studio/demo/</div>
    <div class="privacy">Everything stays on your device. Nothing is sent anywhere.</div>
  </div>
</div>
</body>
</html>
