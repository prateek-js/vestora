<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Figtree:wght@300..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { width: 1270px; height: 760px; overflow: hidden; }
  .stage { width: 1270px; height: 760px; position: relative; background: var(--mist); box-sizing: border-box; padding: 60px 70px; display: flex; flex-direction: column; }
  .logo-row { display: flex; align-items: center; gap: 12px; }
  .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--level); color: var(--paper); display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px; }
  .logo-word { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: 0.16em; font-size: 18px; }
  .middle { display: flex; align-items: center; gap: 44px; flex: 1; min-height: 0; }
  .copy { width: 470px; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 54px; line-height: 1.12; margin: 0 0 22px; letter-spacing: -0.01em; }
  .sub { font-size: 23px; line-height: 1.45; color: var(--ink); opacity: 0.72; margin: 0 0 28px; }
  .url { display: inline-block; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 20px; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 13px 28px; }
  .shot { flex: 1; border-radius: 18px; overflow: hidden; border: 3px solid var(--ink); box-shadow: 10px 10px 0 rgba(20,33,61,0.10); background: var(--paper); max-height: 520px; }
  .shot img { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="stage">
  <div class="logo-row">
    <div class="logo-mark">V</div>
    <div class="logo-word">VESTORA</div>
  </div>
  <div class="middle">
    <div class="copy">
      <h1>Try the guided<br>rebalance.</h1>
      <p class="sub">A short walk through your own numbers: what to move, where it goes, what changes. Nothing is saved, nothing is sent.</p>
      <div class="url">vestora-wealth.ai.studio/demo/</div>
    </div>
    <div class="shot">
      <img src="assets/demo-plan.png" alt="The demo journey's rebalance plan screen">
    </div>
  </div>
</div>
</body>
</html>
