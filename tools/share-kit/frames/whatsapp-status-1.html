<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .stage {
    width: 1080px; height: 1920px;
    background: var(--art-investor-bg);
    color: var(--ink-deep);
    padding: 96px 64px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .logo-img { width: 48px; height: 48px; border-radius: 12px; }
  .logo-word { font-size: 21px; }
  .eyebrow {
    margin-top: 38px;
    font-size: 16px; font-weight: 800; letter-spacing: 0.16em;
    color: var(--tilt); text-transform: uppercase; margin-bottom: 18px;
  }
  h1 {
    font-size: 68px; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em;
    color: var(--ink-deep);
  }
  h1 .accent { color: var(--risk); }
  .art-wrap {
    margin: 10px -64px -32px;
    display: flex; justify-content: center; align-items: flex-end;
    flex: 1;
  }
  .art-wrap img { width: 1040px; height: auto; display: block; }
  .bottom { position: relative; z-index: 2; }
  .card {
    background: var(--paper); border-radius: 24px;
    padding: 18px 36px;
    box-shadow: 0 20px 48px rgba(10, 20, 40, 0.09);
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 0;
    border-bottom: 1px solid rgba(20, 33, 61, 0.09);
  }
  .row:last-child { border-bottom: none; }
  .rk { font-size: 23px; font-weight: 800; color: var(--ink-deep); }
  .rv { font-size: 22px; font-weight: 800; color: var(--ink-deep); }
  .rv.tilt { color: var(--tilt); }
  .rv.risk { color: var(--risk); }
  .hint {
    margin-top: 26px; text-align: center;
    font-size: 21px; font-weight: 700; color: rgba(20, 33, 61, 0.78);
  }
  .hint span { color: var(--level); font-weight: 800; }
</style>
</head>
<body>
<div class="stage">
  <div>
    <div class="logo-row">
      <img class="logo-img" src="../../../public/logo-512.png" alt="Vestora Wealth logo">
      <div class="logo-word">VESTORA <span>WEALTH</span></div>
    </div>
    <div class="eyebrow">Sound Familiar?</div>
    <h1>Your money walks past<br>a lot of <span class="accent">biased advice.</span></h1>
  </div>

  <div class="art-wrap">
    <img src="assets/art-investor.png" alt="Indian investor overwhelmed by disconnected finance charts">
  </div>

  <div class="bottom">
    <div class="card">
      <div class="row">
        <span class="rk">Finance websites</span>
        <span class="rv">47 open tabs, generic tips</span>
      </div>
      <div class="row">
        <span class="rk">Commission advisors</span>
        <span class="rv tilt">1.5% Regular MF cut yearly</span>
      </div>
      <div class="row">
        <span class="rk">Wealth managers</span>
        <span class="rv risk">1% AUM · ignore home loan</span>
      </div>
    </div>
    <div class="hint">Tap next for India’s <span>0% commission scale &rarr;</span></div>
  </div>
</div>
</body>
</html>
