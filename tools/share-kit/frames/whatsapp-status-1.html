<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Figtree:wght@300..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .stage { width: 1080px; height: 1920px; position: relative; background: var(--mist); box-sizing: border-box; padding: 90px 80px; display: flex; flex-direction: column; }
  .logo-row { display: flex; align-items: center; gap: 14px; }
  .logo-mark { width: 44px; height: 44px; border-radius: 12px; background: var(--level); color: var(--paper); display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; }
  .logo-word { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: 0.16em; font-size: 22px; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 76px; line-height: 1.1; margin: 90px 0 0; letter-spacing: -0.01em; }
  .street { margin-top: 70px; position: relative; height: 980px; }
  .building { position: absolute; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 28px 26px; box-shadow: 8px 8px 0 rgba(20,33,61,0.10); }
  .sign-top { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 25px; letter-spacing: 0.06em; }
  .sign-sub { font-family: 'JetBrains Mono', monospace; font-size: 19px; color: var(--ink); opacity: 0.62; margin-top: 10px; line-height: 1.4; }
  .tag { display: inline-block; margin-top: 16px; padding: 6px 14px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; color: var(--paper); }
  .walker { position: absolute; }
  .ground { position: absolute; bottom: 40px; left: 0; right: 0; height: 4px; background: var(--ink); opacity: 0.9; border-radius: 2px; }
  .closing { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 46px; line-height: 1.25; margin-top: auto; }
  .closing .door { color: var(--level); }
</style>
</head>
<body>
<div class="stage">
  <div class="logo-row">
    <div class="logo-mark">V</div>
    <div class="logo-word">VESTORA</div>
  </div>
  <h1>Your money walks<br>past a lot of advice.</h1>
  <div class="street">
    <div class="building" style="left:0; top:30px; width:420px;">
      <div class="sign-top">FINANCE SITES</div>
      <div class="sign-sub">47 OPEN TABS<br>GENERIC TIPS</div>
      <span class="tag" style="background: var(--cash);">LOUD</span>
    </div>
    <div class="building" style="right:0; top:300px; width:430px;">
      <div class="sign-top">ADVISOR</div>
      <div class="sign-sub">HIS CUT ON<br>EVERY SALE</div>
      <span class="tag" style="background: var(--tilt);">BIASED</span>
    </div>
    <div class="building" style="left:40px; top:640px; width:440px;">
      <div class="sign-top">WEALTH MANAGER</div>
      <div class="sign-sub">1% OF EVERYTHING,<br>EVERY YEAR</div>
      <span class="tag" style="background: var(--risk);">PRICEY</span>
    </div>
    <!-- the walker, simple Ink figure -->
    <svg class="walker" style="right:180px; top:660px;" width="120" height="170" viewBox="0 0 120 170" fill="none" aria-hidden="true">
      <circle cx="66" cy="30" r="18" fill="#14213D"/>
      <path d="M66 48 L60 100" stroke="#14213D" stroke-width="14" stroke-linecap="round"/>
      <path d="M62 68 L30 88" stroke="#14213D" stroke-width="10" stroke-linecap="round"/>
      <path d="M62 68 L96 84" stroke="#14213D" stroke-width="10" stroke-linecap="round"/>
      <path d="M60 100 L32 150" stroke="#14213D" stroke-width="12" stroke-linecap="round"/>
      <path d="M60 100 L92 152" stroke="#14213D" stroke-width="12" stroke-linecap="round"/>
    </svg>
    <div class="ground"></div>
  </div>
  <div class="closing">There's <span class="door">a door</span> at the end<br>of the street.</div>
</div>
</body>
</html>
